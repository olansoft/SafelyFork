# .github/workflows/safely-fork.yml
# 安全的定时"同步上游"工作流：
#   - 上游被删除        → fetch 失败，安全跳过
#   - 上游被清空        → 文件数量骤减，跳过并报警
#   - 上游重写历史      → 无共同祖先，跳过并报警
#   - 正常更新          → 打安全点 tag 后 merge
#
# 注意：GITHUB_TOKEN 没有更新 .github/workflows/* 的 workflows 权限。
# 若上游合并会改动 workflow，请在 fork 的 Settings → Secrets and variables →
# Actions 中配置 FORK_SYNC_PAT（classic PAT 至少需要 repo + workflow scope）。

name: Safely Fork

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  MIN_FILE_RATIO: "0.40"
  MIN_FILE_COUNT: "3"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT 存在时让 checkout 的凭据也用于后续 git push。
          token: ${{ secrets.FORK_SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: 解析上游仓库
        id: up
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          parent=$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name // empty')

          if [ -z "$parent" ]; then
            echo "不是 fork，或上游已删除 → 无需同步。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=$(gh api "repos/$parent" --jq '.default_branch')

          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          echo "上游: $parent（默认分支 $branch）"


      - name: 拉取上游（上游删除时安全跳过）
        if: steps.up.outputs.skip != 'true'
        id: fetch
        run: |
          git remote add upstream "https://github.com/${{ steps.up.outputs.parent }}.git"

          if ! git fetch upstream "${{ steps.up.outputs.branch }}"; then
            echo "拉取上游失败（可能已删除/转私有）→ 跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi


      - name: 防清空守卫（文件骤减检测）
        if: steps.up.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true'
        id: guard
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          cur=$(git ls-tree -r --name-only HEAD | wc -l)
          up=$(git ls-tree -r --name-only "upstream/${{ steps.up.outputs.branch }}" | wc -l)

          min=$(awk "BEGIN{printf \"%d\", $cur * $MIN_FILE_RATIO}")

          echo "当前文件数=$cur"
          echo "上游文件数=$up"
          echo "最低允许=$min"

          if [ "$up" -lt "$MIN_FILE_COUNT" ] || [ "$up" -lt "$min" ]; then

            echo "::warning::检测到上游文件数量异常下降，跳过同步。"

            title="⚠️ 上游疑似删库/清空，已自动跳过同步"

            if [ -z "$(gh issue list --state open --search "$title" --json number --jq '.[0].number')" ]; then
              gh issue create \
                --title "$title" \
                --body "检测到上游 \`${{ steps.up.outputs.parent }}\` 文件数异常下降：

          当前 fork 文件数：$cur

          上游文件数：$up

          为保护 fork，本次同步已跳过，请人工确认。"
            fi

            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi


      - name: 防历史重写守卫（检测 orphan / force push）
        if: steps.up.outputs.skip != 'true' && steps.fetch.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        id: history_guard
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |

          if ! git merge-base HEAD "upstream/${{ steps.up.outputs.branch }}" >/dev/null; then

            echo "::warning::检测到上游历史与当前 fork 无共同祖先，疑似历史重写。"

            title="⚠️ 上游历史被重写，已自动跳过同步"

            if [ -z "$(gh issue list --state open --search "$title" --json number --jq '.[0].number')" ]; then

              gh issue create \
                --title "$title" \
                --body "检测到上游：

          \`${{ steps.up.outputs.parent }}\`

          当前 fork 与上游默认分支不存在共同 Git 祖先。

          可能原因：
          - force push
          - orphan branch
          - 完全重建历史

          为保护 fork，本次同步已跳过，请人工确认。"

            fi

            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Git 历史连续，允许同步。"


      - name: 安全点 + 合并 + 推送
        if: >-
          steps.up.outputs.skip != 'true' &&
          steps.fetch.outputs.skip != 'true' &&
          steps.guard.outputs.skip != 'true' &&
          steps.history_guard.outputs.skip != 'true'

        env:
          FORK_SYNC_PAT: ${{ secrets.FORK_SYNC_PAT }}
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"


          # 创建同步前安全点
          tag="safepoint/$(date -u +%Y%m%d-%H%M)"

          git tag "$tag" HEAD
          git push origin "$tag" || true


          # 合并上游
          before_merge=$(git rev-parse HEAD)

          if git merge --no-edit "upstream/${{ steps.up.outputs.branch }}"; then

            # 没有 workflow 权限的 GITHUB_TOKEN 无法推送这类合并；在本地
            # 明确报错并保留已推送的安全点，避免远端拒绝信息误导排查。
            changed_workflows=$(git diff --name-only "$before_merge" HEAD -- '.github/workflows/*')
            if [ -n "$changed_workflows" ] && [ -z "$FORK_SYNC_PAT" ]; then
              echo "::error::合并改动了 workflow 文件，但未配置 FORK_SYNC_PAT。请创建带 repo + workflow scope 的 PAT，并保存为仓库 secret FORK_SYNC_PAT。"
              printf '改动的 workflow 文件：\n%s\n' "$changed_workflows"
              exit 1
            fi

            git push origin HEAD

            echo "✅ 已同步上游"
            echo "回滚点: $tag"

          else

            git merge --abort

            echo "::warning::合并冲突，已取消同步，fork 未改变。"

          fi
